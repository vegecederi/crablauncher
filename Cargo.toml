[package]
name = "crab-launcher"
version = "0.1.0"
edition = "2021"
description = "A fast, minimalist Minecraft launcher written in Rust with Slint"
license = "GPL-3.0-only"

[dependencies]
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
md-5 = "0.10"
open = "5"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.19"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true
codegen-units = 256
lto = "off"

[profile.dev.package."*"]
opt-level = 2
debug = false
