<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- Base face (monochrome grayscale) -->
  <rect x="0" y="0" width="8" height="8" fill="#b8b8b8"/>
  <!-- Hair (rows 0-1 full, row 2 sideburns) -->
  <rect x="0" y="0" width="8" height="2" fill="#3a3a3a"/>
  <rect x="0" y="2" width="1" height="1" fill="#3a3a3a"/>
  <rect x="7" y="2" width="1" height="1" fill="#3a3a3a"/>
  <!-- Eyes (row 4: symmetric sclera outer, pupil inner) -->
  <rect x="1" y="4" width="1" height="1" fill="#f2f2f2"/>
  <rect x="2" y="4" width="1" height="1" fill="#4a4a4a"/>
  <rect x="5" y="4" width="1" height="1" fill="#4a4a4a"/>
  <rect x="6" y="4" width="1" height="1" fill="#f2f2f2"/>
  <!-- Nose (row 5 center) -->
  <rect x="3" y="5" width="2" height="1" fill="#8c8c8c"/>
  <!-- Beard & mouth (rows 6-7) -->
  <rect x="2" y="6" width="1" height="1" fill="#525252"/>
  <rect x="3" y="6" width="2" height="1" fill="#737373"/>
  <rect x="5" y="6" width="1" height="1" fill="#525252"/>
  <rect x="2" y="7" width="4" height="1" fill="#525252"/>
</svg>
